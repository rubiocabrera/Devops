<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Iniciar sesión | WebApp DevOps</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <div class="center">
    <form class="card" id="login-form" data-testid="login-form" novalidate>
      <h1>Iniciar sesión</h1>
      <p class="sub">Accede al sistema de gestión de usuarios</p>
      <label for="email">Correo electrónico</label>
      <input id="email" name="email" type="email" autocomplete="username" required data-testid="login-email">
      <label for="password">Contraseña</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required data-testid="login-password">
      <button type="submit" class="full" data-testid="login-submit">Entrar</button>
      <div class="alert" id="login-alert" role="alert" data-testid="login-alert"></div>
      <p class="foot">¿No tienes cuenta? <a href="/register.html" data-testid="go-register">Regístrate</a></p>
    </form>
  </div>
  <script src="/app.js"></script>
  <script>
    if (session.token) window.location.href = '/usuarios.html';
    const form = document.getElementById('login-form');
    const alertBox = document.getElementById('login-alert');
    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = form.email.value.trim();
      const password = form.password.value;
      if (!email || !password) return showAlert(alertBox, 'Ingresa tu correo y contraseña');
      const res = await apiFetch('/api/auth/login', { method: 'POST', body: { email, password }, auth: false });
      if (!res.ok) return showAlert(alertBox, res.data || 'No se pudo iniciar sesión');
      session.save(res.data);
      window.location.href = '/usuarios.html';
    });
  </script>
</body>
</html>
